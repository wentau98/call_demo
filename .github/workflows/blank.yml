name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod install
      
      - name: Build (Simulator)
        run: |
          xcodebuild -workspace VideoCall.xcworkspace \
            -scheme VideoCall \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath ./DerivedData \
            clean build
      
      - name: Package .ipa (Simulator)
        run: |
          APP_PATH=$(find ./DerivedData -name "VideoCall.app" -type d | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r VideoCall.ipa Payload
          rm -rf Payload
          echo "IPA created at: $(pwd)/VideoCall.ipa"
          ls -lh VideoCall.ipa
      
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: VideoCall-Simulator.ipa
          path: VideoCall.ipa
      
