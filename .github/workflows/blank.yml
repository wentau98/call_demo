name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod install
      
      - name: Build (Simulator)
        run: |
          xcodebuild -workspace VideoCall.xcworkspace \
            -scheme VideoCall \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            clean build
      
